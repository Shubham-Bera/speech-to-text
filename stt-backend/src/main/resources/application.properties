# =====================
# Application Settings
# =====================
spring.application.name=speech-to-text
server.port=8080

# =====================
# MySQL Database Config
# =====================
spring.datasource.url=jdbc:mysql://localhost:3306/stt_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate Config
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# File Upload Settings
# (needed for Phase 3 - Audio Upload)
# =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =====================
# Logging
# =====================
logging.level.org.hibernate.SQL=DEBUG

# =====================
# JWT Configuration
# =====================
jwt.secret=sttapp_super_secret_key_shubham_2024_minimum_256bits
jwt.expiration=86400000
# 86400000 ms = 24 hours

# =====================
# AssemblyAI Config
# =====================
assemblyai.api.key=e06811ad75864b5eb3a54225ae552ede

# =====================
# Audio File Storage
# =====================
audio.upload.dir=uploads/audio

assemblyai.llm.url=https://llm-gateway.assemblyai.com/v1/chat/completions