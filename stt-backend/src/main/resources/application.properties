# =====================
# Application Settings
# =====================
spring.application.name=speech-to-text
server.port=${PORT:8080}

# =====================
# MySQL Database Config
# =====================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate Config
# =====================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# File Upload Settings
# =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =====================
# Logging
# =====================
logging.level.org.hibernate.SQL=DEBUG

# =====================
# JWT Configuration
# =====================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================
# AssemblyAI Config
# =====================
assemblyai.api.key=${ASSEMBLYAI_API_KEY}
assemblyai.llm.url=${ASSEMBLYAI_LLM_URL:https://llm-gateway.assemblyai.com/v1/chat/completions}

# =====================
# Audio File Storage
# =====================
audio.upload.dir=${AUDIO_UPLOAD_DIR:uploads/audio}
